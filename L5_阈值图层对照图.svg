<svg viewBox="0 0 680 645" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>L5 核心：能量阈值与六个图层的分段行为（v5 透镜重做 · 回落三段 · 粒子错峰复活）</title>
<desc>横轴为能量 0 到 100，六图层按 20、35、80 阈值分段；黑洞 = 不透光事件视界 + 贴边极细光子环（多普勒不对称）；&gt;80 四段式塌缩 2.65s；&lt;80 三段回落 2.05s（压入奇点→膨胀→外壳数据化成形）。</desc>

<text x="40" y="30" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">能量 (%)</text>
<text x="155" y="48" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#5F5E5A">0</text>
<text x="252" y="48" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#185FA5">20</text>
<text x="325" y="48" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#185FA5">35</text>
<text x="543" y="48" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#185FA5">80</text>
<text x="640" y="48" text-anchor="end" font-family="system-ui,sans-serif" font-size="12" fill="#5F5E5A">100</text>

<path d="M252 58 L252 575" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>
<path d="M325 58 L325 575" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>
<path d="M543 58 L543 575" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>

<text x="40" y="86" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">基准面</text>
<text x="40" y="104" font-family="ui-monospace,monospace" font-size="11" fill="#0C447C">shellInner · base 可关</text>
<rect x="155" y="68" width="388" height="54" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="349" y="95" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" fill="#0C447C">0–80 常显 · 闭合严丝合缝 · 抬升 0</text>
<rect x="543" y="68" width="97" height="54" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5" stroke-dasharray="3 3"/>
<text x="591" y="88" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#0C447C">&gt;80 抬升</text>
<text x="591" y="103" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#0C447C">幽灵 0.30</text>

<text x="40" y="150" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">水晶碎块</text>
<text x="40" y="168" font-family="ui-monospace,monospace" font-size="11" fill="#5F5E5A">285 fragments</text>
<rect x="155" y="132" width="97" height="54" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="203" y="152" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#444441">&lt; 20</text>
<text x="203" y="167" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#444441">不显示</text>
<rect x="252" y="132" width="73" height="54" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="288" y="145" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#0C447C">20–35</text>
<text x="288" y="159" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#0C447C">完整一块</text>
<text x="288" y="173" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#0C447C">无裂缝</text>
<rect x="325" y="132" width="218" height="54" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="434" y="152" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" fill="#0C447C">35–80 轮廓线（裂缝）渐显</text>
<text x="434" y="167" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" fill="#0C447C">＋ 高亮脉冲呼吸</text>
<rect x="543" y="132" width="97" height="54" rx="8" fill="#85B7EB" stroke="#185FA5" stroke-width="0.5"/>
<text x="591" y="145" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#042C53">&gt;80</text>
<text x="591" y="159" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#042C53">爆发·外推</text>
<text x="591" y="173" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#042C53">齿轮旋转</text>

<text x="40" y="214" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">核心外壳</text>
<text x="40" y="232" font-family="ui-monospace,monospace" font-size="11" fill="#5F5E5A">coreMesh 0.8u</text>
<rect x="155" y="196" width="170" height="54" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="240" y="223" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" fill="#0C447C">0–35 α 1.00 → 0.75</text>
<rect x="325" y="196" width="218" height="54" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="434" y="223" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" fill="#0C447C">35–80 α 0.75 → 0.40</text>
<rect x="543" y="196" width="97" height="54" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/>
<text x="591" y="216" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#444441">&gt;80</text>
<text x="591" y="230" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#444441">脉冲渐隐</text>
<text x="591" y="244" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#444441">α → 0</text>

<text x="40" y="278" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">黑洞体</text>
<text x="40" y="296" font-family="ui-monospace,monospace" font-size="11" fill="#5F5E5A">bhGroup · 12 面机械壳</text>
<rect x="155" y="260" width="97" height="54" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="203" y="280" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#444441">0–20</text>
<text x="203" y="295" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#444441">紧闭 0.20u</text>
<rect x="252" y="260" width="291" height="54" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="397" y="280" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" fill="#0C447C">20–80 面板沿法线抬升（大小不变）</text>
<text x="397" y="295" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" fill="#0C447C">距中心 = 黑洞 r + 0.10u → 0.32</text>
<rect x="543" y="260" width="97" height="54" rx="8" fill="#85B7EB" stroke="#185FA5" stroke-width="0.5"/>
<text x="591" y="273" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#042C53">&gt;80 四段塌缩</text>
<text x="591" y="287" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#042C53">&lt;80 三段回落</text>
<text x="591" y="301" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#042C53">→ 0.40u</text>

<text x="40" y="330" font-family="system-ui,sans-serif" font-size="12" fill="#2C2C2A">视界 / 透镜</text>
<text x="40" y="344" font-family="ui-monospace,monospace" font-size="10" fill="#888780">两个 mesh</text>
<rect x="155" y="320" width="200" height="30" rx="6" fill="#1F1F1D" stroke="#1F1F1D" stroke-width="0.5"/>
<text x="255" y="335" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="10" fill="#FFFFFF">事件视界 = 不透光黑球 · 遮住背后（外径/1.5）</text>
<rect x="355" y="320" width="285" height="30" rx="6" fill="#EAE7F5" stroke="#5F4FB8" stroke-width="0.5"/>
<text x="497" y="335" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="10" fill="#3B2E8C">引力透镜 = 贴边极细光子环 + 次级子环 + 多普勒不对称</text>

<text x="40" y="372" font-family="system-ui,sans-serif" font-size="12" fill="#2C2C2A">塌缩时序</text>
<text x="40" y="386" font-family="ui-monospace,monospace" font-size="11" fill="#888780">2.65s</text>
<rect x="155" y="356" width="201" height="42" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="255" y="370" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="10.5" fill="#0C447C">① 吸入 1.10s：面板 + 全部粒子被卷入</text>
<text x="255" y="385" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="10.5" fill="#0C447C">黑洞本身不缩，只略胀</text>
<rect x="356" y="356" width="101" height="42" rx="6" fill="#85B7EB" stroke="#185FA5" stroke-width="0.5"/>
<text x="406" y="368" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="10.5" fill="#042C53">② 塌缩 0.55s</text>
<text x="406" y="381" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="10.5" fill="#042C53">黑洞自身 → 中心点</text>
<text x="406" y="393" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="10.5" fill="#042C53">多向巨力挤压</text>
<rect x="457" y="356" width="82" height="42" rx="6" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="498" y="370" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="10.5" fill="#0C447C">③ 闪光</text>
<text x="498" y="385" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="10.5" fill="#0C447C">0.45s 爆白</text>
<rect x="539" y="356" width="101" height="42" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="589" y="370" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="10.5" fill="#0C447C">④ 放大 0.55s</text>
<text x="589" y="385" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace,monospace" font-size="10" fill="#0C447C">→ 0.40u</text>

<text x="40" y="422" font-family="system-ui,sans-serif" font-size="12" fill="#2C2C2A">回落时序</text>
<text x="40" y="436" font-family="ui-monospace,monospace" font-size="11" fill="#888780">2.05s</text>
<rect x="155" y="406" width="118" height="42" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="214" y="418" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="10.5" fill="#0C447C">① 压入奇点 0.50s</text>
<text x="214" y="432" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="10.5" fill="#0C447C">多向不等巨力挤压</text>
<rect x="273" y="406" width="142" height="42" rx="6" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="344" y="418" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="10.5" fill="#0C447C">② 膨胀 0.60s</text>
<text x="344" y="432" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="10.5" fill="#0C447C">→ 当前能量对应尺寸</text>
<rect x="415" y="406" width="225" height="42" rx="6" fill="#85B7EB" stroke="#185FA5" stroke-width="0.5"/>
<text x="527" y="418" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="10.5" fill="#042C53">③ 外壳数据化成形 0.95s（逐面错峰）</text>
<text x="527" y="432" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="10.5" fill="#042C53">数据流虚影 → 实体 · 浮升到位（无瞬移）</text>

<text x="40" y="472" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">数据粒子</text>
<text x="40" y="490" font-family="ui-monospace,monospace" font-size="11" fill="#5F5E5A">dataParticles 400</text>
<rect x="155" y="454" width="97" height="54" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="203" y="474" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#0C447C">0–20</text>
<text x="203" y="489" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#0C447C">自由游走</text>
<rect x="252" y="454" width="291" height="54" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="397" y="474" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#0C447C">20–80 加速吸入 · 吞噬后回收重生 · 绕中心公转</text>
<text x="397" y="489" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#0C447C">复活 / 换装走逐帧预算（约 1.1s 错峰浮现）</text>
<rect x="543" y="454" width="97" height="54" rx="8" fill="#85B7EB" stroke="#185FA5" stroke-width="0.5"/>
<text x="591" y="474" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#042C53">&gt;80 全部被吸入</text>
<text x="591" y="489" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#042C53">吸完不重生</text>

<text x="40" y="536" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">环境粒子</text>
<text x="40" y="554" font-family="ui-monospace,monospace" font-size="11" fill="#5F5E5A">ambient 600</text>
<rect x="155" y="518" width="388" height="54" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/>
<text x="349" y="545" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="12" fill="#444441">0–80 隐藏（≥ 0.80 才启用）</text>
<rect x="543" y="518" width="97" height="54" rx="8" fill="#85B7EB" stroke="#185FA5" stroke-width="0.5"/>
<text x="591" y="538" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#042C53">涌入</text>
<text x="591" y="553" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#042C53">撞击储能</text>

<text x="40" y="597" font-family="system-ui,sans-serif" font-size="11" fill="#5F5E5A">注：20–35 碎块已显现，但完整一块 —— 无裂缝线、无轮廓线、无脉冲呼吸（SEAM_SHOW_P = 0.35 尚未达到）。</text>
<text x="40" y="613" font-family="system-ui,sans-serif" font-size="11" fill="#5F5E5A">事件视界（不透光黑球，外径/1.5）与引力透镜（贴边极细光子环 + 次级子环 + 多普勒不对称）是两个部件。</text>
<text x="40" y="629" font-family="system-ui,sans-serif" font-size="11" fill="#5F5E5A">塌缩 2.65s：吸入（黑洞不缩）→ 压入奇点（压扁+扭曲）→ 闪光 → 放大 0.40u；回落 2.05s：奇点 → 膨胀 → 外壳成形。</text>
</svg>
